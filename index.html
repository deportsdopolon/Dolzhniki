<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#2a1458" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Должники</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      if (!("serviceWorker" in navigator)) return;
      function reloadOnce() {
        var now = Date.now();
        var prev = Number(sessionStorage.getItem("dolzhniki-reload-at") || 0);
        if (now - prev < 15000) return;
        sessionStorage.setItem("dolzhniki-reload-at", String(now));
        location.reload();
      }
      navigator.serviceWorker.addEventListener("controllerchange", reloadOnce);
      navigator.serviceWorker.addEventListener("message", function (e) {
        if (e.data && e.data.type === "RELOAD") reloadOnce();
      });
      function kick(reg) {
        if (!reg) return;
        reg.update().catch(function () {});
        if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
      }
      function stamp() {
        var files = ["./index.html", "./styles.css", "./app.js", "./sw.js"];
        return Promise.all(files.map(function (file) {
          return fetch(file, { cache: "no-store" }).then(function (res) {
            if (!res.ok) return file + ":err";
            return file + "=" + (res.headers.get("etag") || "") + ":" + (res.headers.get("content-length") || "");
          }).catch(function () { return file + ":off"; });
        })).then(function (parts) { return parts.join("|"); });
      }
      function watch() {
        stamp().then(function (next) {
          if (!next || next.indexOf(":off") !== -1) return;
          var prev = sessionStorage.getItem("dolzhniki-stamp");
          if (prev && prev !== next) reloadOnce();
          sessionStorage.setItem("dolzhniki-stamp", next);
        }).catch(function () {});
      }
      navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then(function (reg) {
        kick(reg);
        watch();
      }).catch(function () {});
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible") return;
        navigator.serviceWorker.getRegistration().then(kick).catch(function () {});
        watch();
      });
      window.addEventListener("focus", function () {
        navigator.serviceWorker.getRegistration().then(kick).catch(function () {});
        watch();
      });
      setInterval(function () {
        if (document.visibilityState !== "visible") return;
        navigator.serviceWorker.getRegistration().then(kick).catch(function () {});
        watch();
      }, 30000);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">₽</span>
      <div class="titles">
        <div class="h1">Должники</div>
        <div class="sub" id="statsLine">—</div>
      </div>
    </div>
    <div class="topActions"><button class="btn ghost" id="btnBackup" type="button" aria-label="Сохранить копию">⤓</button><button class="btn" id="btnAddClient" type="button" aria-label="Добавить клиента">＋</button></div>
  </header>

  <main class="wrap">
    <section class="list" id="list"></section>
  <div class="footerLine"><span id="appVersion">Версия —</span></div>
  </main>

  <!-- Modal -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="sheet">
      <div class="sheetTop">
        <div class="sheetTitle" id="sheetTitle">—</div>
        <button class="x" id="btnClose" type="button" aria-label="Закрыть">✕</button>
      </div>
      <div class="sheetBody" id="sheetBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
